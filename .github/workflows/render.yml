# adforge-render-workflow v2 — managed by Animato AdForge. The app re-writes this file when a newer version ships.
# Renders one ad per run: downloads the renderer from the app, renders with Remotion (headless Chrome + FFmpeg),
# publishes the MP4 as a GitHub Release asset and reports progress in jobs/<id>/status.json on the `jobs` branch.
name: render
run-name: render ${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: job id
        required: true
      api_base:
        description: app origin that serves /render-bundle.tgz
        required: true
permissions:
  contents: write
concurrency:
  group: render-${{ inputs.job_id }}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      API_BASE: ${{ inputs.api_base }}
      JOB_ID: ${{ inputs.job_id }}
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download renderer from the app
        run: |
          mkdir -p renderer
          curl -fsSL --retry 4 --retry-delay 3 "${API_BASE%/}/render-bundle.tgz" -o bundle.tgz
          tar -xzf bundle.tgz -C renderer
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('renderer/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: System libraries and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libatk-bridge2.0-0 libgbm1 libxkbcommon0 libasound2t64 fonts-noto-color-emoji fonts-noto-cjk >/dev/null
      - name: Install dependencies
        working-directory: renderer
        run: npm ci --no-audit --no-fund
      - name: Cache renderer (Chrome headless shell, bundle)
        uses: actions/cache@v4
        with:
          path: |
            renderer/node_modules/.remotion
            renderer/.cache/bundle
          key: renderer-${{ runner.os }}-${{ hashFiles('renderer/package-lock.json', 'renderer/src/**', 'renderer/remotion/**', 'renderer/vendor/**') }}
          restore-keys: renderer-${{ runner.os }}-
      - name: Build template catalogue
        working-directory: renderer
        run: node scripts/build-catalog.mjs
      - name: Render and publish
        working-directory: renderer
        env:
          REMOTION_GL: swangle
        run: node scripts/render-job.mjs "$JOB_ID"
